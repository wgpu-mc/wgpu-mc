tasks.register('copyToResources', Copy) {
    dependsOn 'build'

    from ('target/release/' + System.mapLibraryName("wgpu_mc_jni"))
    into '../fabric/build/resources/assets/wgpu_mc/natives/'
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.register("build", Exec) {
    commandLine "cargo", "build", "--release"
}